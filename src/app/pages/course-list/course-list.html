<h2>Available Courses</h2>

<!-- Search -->
<input
  type="text"
  placeholder="Search courses..."
  [(ngModel)]="searchTerm"
  (input)="onSearch()">

<!-- Error -->
<p class="error" *ngIf="errorMessage$ | async as error">{{ error }}</p>

<!-- Loading -->
<p *ngIf="isLoading$ | async">Loading courses...</p>

<!-- Course List — async pipe auto-subscribes and unsubscribes -->
<div *ngIf="!(isLoading$ | async)">

  <ng-container *ngIf="courses$ | async as courses">

    <div *ngIf="courses.length > 0; else noCourses">
      <app-course-card
        *ngFor="let course of courses; trackBy: trackByCourseId"
        [course]="course"
        appHighlight="lightyellow"
        (click)="goToDetail(course.id)"
        style="cursor:pointer; display:block;">
      </app-course-card>
    </div>

    <ng-template #noCourses>
      <p>No courses found.</p>
    </ng-template>

  </ng-container>

</div>
